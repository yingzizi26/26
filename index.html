<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2a7f6e">
  <title>欧阳樱姿 · 旅游管理 · 个人简历</title>
  <!-- Font Awesome 图标库 (国内CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* ----- 全局重置 & 变量 ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2a7f6e;
      --primary-light: #3fa392;
      --primary-dark: #1a5f52;
      --accent: #e8b86d;
      --accent-light: #f3d9a4;
      --bg: #f7f5f0;
      --bg-card: #ffffff;
      --text: #1e2b2a;
      --text-light: #3f4f4e;
      --text-muted: #6b7b7a;
      --border: #dce3e1;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.2s ease;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --max-width: 1100px;
      --nav-height: 68px;
    }

    /* 深色模式 */
    [data-theme="dark"] {
      --bg: #1a2222;
      --bg-card: #253030;
      --text: #e8edec;
      --text-light: #c8d4d2;
      --text-muted: #9aabaa;
      --border: #3a4a48;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      --primary: #51b5a2;
      --primary-light: #70cdb9;
      --primary-dark: #3a9b88;
      --accent: #e8b86d;
      --accent-light: #c9a35a;
    }

    /* 打印样式 */
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .card { box-shadow: none !important; border: 1px solid #ccc !important; }
      [data-theme="dark"] { --bg: #fff; --bg-card: #fff; --text: #000; --text-light: #333; --text-muted: #666; --border: #aaa; }
      .hero-avatar img { filter: grayscale(0.2); }
      .section-title::after { background: #ccc !important; }
      .modal { display: none !important; }
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      transition: background var(--transition), color var(--transition);
      line-height: 1.6;
      padding-top: var(--nav-height);
      margin: 0;
    }

    /* ----- 导航栏 ----- */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--nav-height);
      background: var(--bg-card);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 1000;
      transition: background var(--transition), border var(--transition);
      box-shadow: 0 2px 12px rgba(0,0,0,0.02);
    }
    .nav-brand {
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--primary);
      letter-spacing: 0.5px;
    }
    .nav-brand i {
      margin-right: 8px;
      color: var(--accent);
    }
    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
      list-style: none;
      font-size: 0.95rem;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text-light);
      transition: color 0.15s;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      padding-bottom: 4px;
    }
    .nav-links a:hover { color: var(--primary); border-bottom-color: var(--primary); }
    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .nav-actions button {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-light);
      background: var(--bg);
      transition: all 0.15s;
    }
    .nav-actions button:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .nav-actions button i {
      margin-right: 4px;
    }

    /* ----- 通用容器 ----- */
    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 24px 24px 12px;
    }
    section {
      margin-bottom: 48px;
      animation: fadeUp 0.35s ease both;
    }
    .section-title {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: -0.3px;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-title i {
      color: var(--accent);
      font-size: 1.5rem;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--primary-light), transparent);
    }
    [data-theme="dark"] .section-title { color: var(--primary-light); }

    /* ----- Hero 区（带头像） ----- */
    .hero {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      align-items: center;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 32px 36px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: background var(--transition), border var(--transition);
    }
    .hero-avatar {
      flex: 0 0 120px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--primary-light);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      background: var(--bg);
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .hero-avatar:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 30px rgba(42, 127, 110, 0.3);
    }
    .hero-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero-avatar .click-hint {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 0.6rem;
      padding: 2px 8px;
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .hero-avatar:hover .click-hint {
      opacity: 1;
    }
    .hero-text { flex: 2; min-width: 200px; }
    .hero-text h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }
    .hero-text .subhead {
      font-size: 1rem;
      color: var(--text-light);
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
    }
    .hero-text .subhead span { display: inline-flex; align-items: center; gap: 6px; }
    .hero-text .subhead i { color: var(--primary-light); width: 16px; }
    .hero-text p {
      color: var(--text-light);
      max-width: 600px;
      margin-bottom: 16px;
      font-size: 0.98rem;
    }
    .hero-badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 16px;
    }
    .badge {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-light);
      transition: all 0.15s;
    }
    .badge i {
      margin-right: 4px;
      color: var(--primary);
      font-size: 0.7rem;
    }
    .badge-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .badge-primary i { color: #fff; }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      border: none;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn i { font-size: 0.9rem; }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
    }
    .btn-outline:hover { background: var(--primary); color: #fff; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(42, 127, 110, 0.25); }

    /* ----- 卡片通用 ----- */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px 24px;
      box-shadow: var(--shadow);
      transition: all 0.2s;
      margin-bottom: 20px;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px rgba(0,0,0,0.06); }
    .card-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .card-title { font-size: 1.2rem; font-weight: 600; color: var(--primary-dark); }
    .card-title i { margin-right: 8px; color: var(--accent); font-size: 1rem; }
    .card-sub { font-weight: 500; color: var(--text-light); }
    .card ul {
      list-style: none;
      padding-left: 0;
      margin-top: 6px;
    }
    .card li {
      padding: 4px 0 4px 20px;
      position: relative;
      color: var(--text-light);
    }
    .card li::before {
      content: "▹";
      position: absolute;
      left: 0;
      color: var(--primary);
      font-weight: 600;
    }

    /* 技能网格（徽章风格） */
    .skill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .skill-chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 8px 18px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-light);
      box-shadow: var(--shadow);
      transition: all 0.15s;
    }
    .skill-chip i {
      margin-right: 6px;
      color: var(--primary);
      font-size: 0.8rem;
    }
    .skill-chip:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }
    .skill-chip:hover i { color: var(--accent); }

    /* 证书标签 */
    .cert-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-top: 4px;
    }
    .cert-tag {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 14px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .cert-tag i {
      margin-right: 4px;
      color: var(--accent);
      font-size: 0.7rem;
    }

    /* 兴趣 */
    .interest-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      padding: 8px 0;
    }
    .interest-item {
      font-size: 0.95rem;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .interest-item i {
      color: var(--primary);
      width: 18px;
      font-size: 1rem;
    }

    /* 页脚 */
    footer {
      margin-top: 40px;
      padding: 20px 0 30px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    footer i {
      color: var(--accent);
      margin: 0 4px;
    }

    /* ----- 图片预览弹窗 (Modal) ----- */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.25s ease;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: var(--radius);
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      border: 3px solid rgba(255,255,255,0.15);
      object-fit: contain;
      animation: scaleIn 0.3s ease;
      background: #fff;
    }
    .modal-close {
      position: fixed;
      top: 30px;
      right: 40px;
      font-size: 2.4rem;
      color: #fff;
      cursor: pointer;
      background: rgba(0,0,0,0.4);
      border: none;
      border-radius: 50%;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-weight: 300;
      line-height: 1;
    }
    .modal-close:hover {
      background: rgba(255,255,255,0.2);
      transform: rotate(90deg);
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes scaleIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 工具类 */
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .back-top {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 60px;
      padding: 10px 18px;
      font-size: 0.9rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      cursor: pointer;
      transition: all 0.2s;
      z-index: 999;
    }
    .back-top:hover { transform: scale(1.04); }
    .back-top i { margin-right: 4px; }

    /* 响应式 */
    @media (max-width: 720px) {
      nav { padding: 0 16px; flex-wrap: wrap; height: auto; min-height: 60px; gap: 4px; }
      .nav-links { gap: 10px; font-size: 0.8rem; flex-wrap: wrap; }
      .hero { padding: 24px 20px; flex-direction: column; align-items: center; text-align: center; }
      .hero-avatar { flex: 0 0 100px; width: 100px; height: 100px; }
      .hero-text h1 { font-size: 1.8rem; }
      .container { padding: 16px 12px; }
      .card-header { flex-direction: column; align-items: flex-start; gap: 4px; }
      .section-title { font-size: 1.3rem; }
      .hero-actions { justify-content: center; }
      .hero-badge-group { justify-content: center; }
      .modal-close { top: 16px; right: 16px; width: 44px; height: 44px; font-size: 1.8rem; }
    }
    @media (max-width: 480px) {
      .nav-links a { font-size: 0.7rem; }
      .btn { padding: 8px 18px; font-size: 0.85rem; }
    }

    /* 打印优化 */
    @media print {
      .back-top, .nav-actions, .no-print { display: none !important; }
      nav { position: relative; border: none; box-shadow: none; }
      .hero { border: 1px solid #ccc; }
      .card:hover { transform: none !important; }
      section { page-break-inside: avoid; }
      .modal { display: none !important; }
    }
  </style>
</head>

    function render() {
      const avatarHTML = `

          <img src="${resume.avatar}" alt="欧阳樱姿职业照" onerror="this.style.display='none'; this.parentElement.style.background='var(--primary-light)'; this.parentElement.innerHTML='<span style=\\'font-size:2.6rem;color:#fff;display:flex;align-items:center;justify-content:center;height:100%;\\'><i class=\\'fas fa-user\\'></i></span>';">

        <section id="hero">
          <div class="hero">
            ${avatarHTML}
            <div class="hero-text">
              <h1>${resume.name}</h1>
              <div class="subhead">
                <span><i class="fas fa-graduation-cap"></i> ${resume.school} · ${resume.major} · ${resume.grade}</span>
                <span><i class="fas fa-map-pin"></i> ${resume.city}</span>
                <span><i class="fas fa-phone"></i> ${resume.phone}</span>
              </div>
              <p>${resume.summary}</p>
              <div class="hero-badge-group">
                ${resume.badges.map(b => `<span class="badge"><i class="fas fa-tag"></i> ${b}</span>`).join('')}
              </div>
              <div class="hero-actions">
                <button class="btn" id="copyEmailBtn"><i class="fas fa-envelope"></i> 复制邮箱</button>
                <a href="mailto:${resume.email1}" class="btn btn-outline"><i class="fas fa-envelope"></i> QQ邮箱</a>
                <a href="mailto:${resume.email2}" class="btn btn-outline"><i class="fas fa-envelope"></i> Outlook</a>
              </div>
            </div>
          </div>
        </section>

        <!-- 专业技能 -->
        <section id="skills">
          <h2 class="section-title"><i class="fas fa-tools"></i> 专业技能</h2>
          <div class="skill-grid">
            ${resume.skills.map(s => `<div class="skill-chip"><i class="fas fa-check-circle"></i> ${s}</div>`).join('')}
          </div>
        </section>

        <!-- 项目/实践经历 -->
        <section id="projects">
          <h2 class="section-title"><i class="fas fa-folder-open"></i> 项目/实践经历</h2>
          ${resume.projects.map(p => `
            <div class="card">
              <div class="card-header">
                <span class="card-title"><i class="fas fa-flag"></i> ${p.title}</span>
              </div>
              <ul>${p.details.map(d => `<li>${d}</li>`).join('')}</ul>
            </div>
          `).join('')}
        </section>

        <!-- 教育背景 -->
        <section id="education">
          <h2 class="section-title"><i class="fas fa-graduation-cap"></i> 教育背景</h2>
          <div class="card" style="margin-bottom:0;">
            <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline;">
              <span style="font-weight:600; font-size:1.15rem;"><i class="fas fa-university" style="color:var(--primary);margin-right:8px;"></i>${resume.education.school} · ${resume.education.major}</span>
              <span style="color:var(--text-muted);"><i class="fas fa-calendar-alt"></i> 本科在读 · 2026级</span>
            </div>
            <div style="color:var(--text-light); margin-top:6px;"><i class="fas fa-book" style="color:var(--accent);margin-right:6px;"></i> 主修课程：${resume.education.courses}</div>
          </div>
        </section>

        <!-- 证书 -->
        <section id="certificates">
          <h2 class="section-title"><i class="fas fa-certificate"></i> 证书</h2>
          <div class="card" style="margin-bottom:0;">
            <div class="cert-wrap">
              ${resume.certificates.map(c => `<span class="cert-tag"><i class="fas fa-award"></i> ${c}</span>`).join('')}
            </div>
          </div>
        </section>

        <!-- 个人特长 & 兴趣爱好 -->
        <section id="interests">
          <h2 class="section-title"><i class="fas fa-heart"></i> 个人特长 & 兴趣爱好</h2>
          <div class="card" style="margin-bottom:0;">
            <div class="interest-list">
              ${resume.interests.map(i => `<span class="interest-item"><i class="${i.icon}"></i> ${i.text}</span>`).join('')}
            </div>
          </div>
        </section>

        <!-- 自我评价 -->
        <section id="self-eval">
          <h2 class="section-title"><i class="fas fa-comment-dots"></i> 自我评价</h2>
          <div class="card" style="margin-bottom:0; background:var(--bg); border-style:dashed;">
            <p style="color:var(--text-light); font-size:1rem; line-height:1.7;"><i class="fas fa-quote-left" style="color:var(--accent);margin-right:8px;"></i>${resume.selfEval}</p>
          </div>
        </section>

        <footer><i class="fas fa-code"></i> ${resume.footer}</footer>
      `;

      app.innerHTML = html;
      initCopyEmail();
    }

    // ---------- 图片预览弹窗 ----------
    function openModal(src) {
      const modal = document.getElementById('imageModal');
      const img = document.getElementById('modalImg');
      img.src = src;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('imageModal');
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    // ---------- 复制邮箱 ----------
    function initCopyEmail() {
      const btn = document.getElementById('copyEmailBtn');
      if (!btn) return;
      btn.addEventListener('click', function() {
        const user = '435236206';
        const domain = 'qq.com';
        const email = user + '@' + domain;
        navigator.clipboard.writeText(email).then(() => {
          const orig = this.innerHTML;
          this.innerHTML = '<i class="fas fa-check"></i> 已复制';
          setTimeout(() => { this.innerHTML = orig; }, 1800);
        }).catch(() => {
          alert('请手动复制: ' + email);
        });
      });
    }

    // ---------- 主题切换 (带图标切换) ----------
    document.getElementById('themeToggle').addEventListener('click', function() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const newTheme = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      const icon = document.getElementById('themeIcon');
      if (newTheme === 'dark') {
        icon.className = 'fas fa-sun';
      } else {
        icon.className = 'fas fa-moon';
      }
    });

    // ---------- 打印 ----------
    document.getElementById('printBtn').addEventListener('click', () => window.print());

    // ---------- 返回顶部 ----------
    document.getElementById('backTop').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ---------- 启动 ----------
    render();
  </script>
</body>
</html>
